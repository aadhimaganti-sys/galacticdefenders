name: Galactic Defenders

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            label: Linux x86_64
            runner: ubuntu-22.04
            archive: GalacticDefenders-linux-x86_64.zip
          - id: windows-x86_64
            label: Windows x86_64
            runner: windows-2022
            archive: GalacticDefenders-windows-x86_64.zip
          - id: macos-arm64
            label: macOS Apple silicon
            runner: macos-15
            archive: GalacticDefenders-macos-apple-silicon.zip
          - id: macos-x86_64
            label: macOS Intel
            runner: macos-15-intel
            archive: GalacticDefenders-macos-intel.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm GalacticDefenders.spec
      - name: Package application
        run: >-
          python scripts/package_release.py
          --source dist/GalacticDefenders
          --output release/${{ matrix.archive }}
      - name: Upload build archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish latest downloads
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title "Galactic Defenders - Latest builds" --notes "Automatically rebuilt from the latest main branch source."
          else
            gh release create latest-build --title "Galactic Defenders - Latest builds" --notes "Automatically rebuilt from the latest main branch source." --target "$GITHUB_SHA"
          fi
          gh release upload latest-build release-assets/*.zip --clobber
          gh release edit latest-build --latest

  deploy-pages:
    name: Deploy website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4