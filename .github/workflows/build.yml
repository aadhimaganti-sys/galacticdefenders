name: Build Galactic Defenders

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change this if you use a different version on your Pi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller

    - name: Build Executable
      # Replace 'main.py' with your actual root file if it is named differently
      run: pyinstaller --onefile --windowed --name GalacticDefenders main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Galactic-Defenders-${{ matrix.os }}
        path: dist/